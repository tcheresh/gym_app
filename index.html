<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.json">
  <title>Gym Log Pro</title>
  <style>
    :root{--bg:#0b0d10;--card:#151922;--card2:#0f131a;--muted:#8f9bad;--text:#f4f7fb;--accent:#5ee1a2;--line:#283041;--danger:#ff7b7b;--warn:#ffd166;--ok:#7cf0b1}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select,textarea{font:inherit} header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.96);backdrop-filter:blur(10px);padding:12px 14px;border-bottom:1px solid var(--line)}
    .top{display:flex;gap:10px;align-items:center} h1{font-size:20px;margin:0;flex:1}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#1d2c26;color:var(--accent);border:1px solid #274137}
    select,input,textarea{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}select{width:100%;margin-top:10px}main{padding:12px;max-width:820px;margin:auto;padding-bottom:90px}
    .exercise{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:14px}.exercise h2{font-size:18px;margin:0 0 4px}.target{font-size:13px;color:var(--muted)}
    .previous,.suggestion{margin-top:9px;padding:9px 10px;background:var(--card2);border-radius:10px;font-size:13px}.suggestion{border-left:3px solid var(--accent)}.pr{color:var(--ok);font-weight:700}
    .setrow{display:grid;grid-template-columns:34px 1.1fr .8fr .9fr 40px;gap:7px;align-items:center;margin-top:9px}.setnum{font-size:12px;color:var(--muted);text-align:center}.setrow input,.setrow select{width:100%;margin:0;padding:10px 8px}
    .iconbtn{padding:9px 0;background:#2b1d22;color:var(--danger);border:0;border-radius:9px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#232b3a;color:var(--text)}.btn.accent{background:var(--accent);color:#07110d;font-weight:700}.btn.full{width:100%;margin-top:10px}
    .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}textarea{width:100%;min-height:60px;margin-top:10px}.rest-card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:18px 0;padding:28px 18px;text-align:center}
    .footerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,13,16,.97);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}.footerbar .btn{flex:1}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}.panel h3{margin:0 0 10px}.history-item{padding:10px 0;border-top:1px solid var(--line);font-size:13px}.history-item:first-child{border-top:0}canvas{width:100%;height:220px;background:var(--card2);border-radius:10px}.editrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px 38px 38px;gap:6px;margin:8px 0}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}
    @media(max-width:600px){.setrow{grid-template-columns:28px 1fr .75fr .9fr 36px}.setrow input,.setrow select{font-size:14px}}
  </style>
</head>
<body>
<header><div class="top"><h1>Gym Log Pro</h1><span class="badge">Android PWA</span></div><select id="daySelect"></select></header>
<main>
  <div id="workout"></div>
  <div class="panel"><h3>Progress</h3><select id="chartExercise"></select><canvas id="chart" width="760" height="220"></canvas><div class="small" style="margin-top:6px">Plots your best logged weight for the selected exercise.</div></div>
  <div class="panel"><h3>Program editor</h3><div class="small">Edit exercise names and targets. Changes are saved on this device.</div><div id="editor"></div><button class="btn full" id="resetProgram">Reset to default program</button></div>
  <div class="panel"><h3>Backup & export</h3><div class="tools"><button class="btn" id="exportCsv">Export CSV</button><button class="btn" id="exportJson">Backup JSON</button><label class="btn" style="text-align:center;cursor:pointer">Import JSON<input id="importJson" type="file" accept=".json" class="hidden"></label></div></div>
  <div class="panel"><h3>Recent workouts</h3><div id="history"></div></div>
</main>
<div class="footerbar" id="footerbar"><button class="btn accent" id="saveWorkout">Save Workout</button><button class="btn" id="clearWorkout">Clear</button></div>
<script>
const DEFAULT_PROGRAM={
"Day 1 — Shoulders, Triceps, Abs":[{name:"Seated DB Shoulder Press",target:"Warmup + 1 working set × 6–8",min:6,max:8},{name:"DB Lateral Raises",target:"1 working set × 8–10",min:8,max:10},{name:"DB Shrugs",target:"1 working set × 8–10",min:8,max:10},{name:"Triceps Pushdowns",target:"1 working set × 6–8",min:6,max:8},{name:"Overhead Cable Extension",target:"1 working set × 8–10",min:8,max:10},{name:"Weighted Crunches",target:"2 × 10–20",min:10,max:20,sets:2},{name:"Hanging Leg Raises",target:"2 × 10–20",min:10,max:20,sets:2}],
"Day 2 — Back, Rear Delts":[{name:"Close-Grip Pulldowns",target:"Warmup + 1 working set × 6–8",min:6,max:8},{name:"Yates Row",target:"1 working set × 6–8",min:6,max:8},{name:"Seated Cable Rows",target:"1 working set × 6–8",min:6,max:8},{name:"Machine Pullovers",target:"1 working set × 6–8",min:6,max:8},{name:"Reverse Pec Deck",target:"1 working set × 8–10",min:8,max:10},{name:"Straight-Arm Pulldown",target:"1 working set × 8–10",min:8,max:10}],
"Day 3 — REST":[],
"Day 4 — Chest, Biceps, Abs":[{name:"Smith Machine Incline Press",target:"Warmup + 1 working set × 6–8",min:6,max:8},{name:"Flat Machine Press",target:"1 working set × 6–8",min:6,max:8},{name:"Cable Crossovers",target:"1 working set × 8–10",min:8,max:10},{name:"Incline DB Curls",target:"1 working set × 6–8",min:6,max:8},{name:"Preacher Curls",target:"1 working set × 6–8",min:6,max:8},{name:"Ab Crunch Machine",target:"2 × 10–20",min:10,max:20,sets:2}],
"Day 5 — REST":[],
"Day 6 — Legs":[{name:"Leg Extensions",target:"Warmup + 1 working set × 10–12",min:10,max:12},{name:"Leg Press",target:"1 working set × 10–12",min:10,max:12},{name:"Hack Squats",target:"1 working set × 10–12",min:10,max:12},{name:"Lying Leg Curl",target:"1 working set × 8–10 (double rest-pause)",min:8,max:10},{name:"Seated Calf Raises",target:"Warmup + 1 working set × 10–15",min:10,max:15}],
"Day 7 — REST":[]};
const clone=x=>JSON.parse(JSON.stringify(x));let program=JSON.parse(localStorage.getItem('gym-program')||'null')||clone(DEFAULT_PROGRAM);const $=id=>document.getElementById(id);const daySelect=$('daySelect'),workout=$('workout'),historyEl=$('history');
function getHistory(){return JSON.parse(localStorage.getItem('gym-history')||'[]')}function setHistory(h){localStorage.setItem('gym-history',JSON.stringify(h))}function draftKey(day){return 'gym-draft-'+day}
function initDays(){daySelect.innerHTML='';Object.keys(program).forEach(day=>{const o=document.createElement('option');o.value=day;o.textContent=day;daySelect.appendChild(o)})}
function previousEntry(exName){for(const w of getHistory()){const e=w.exercises?.find(e=>e.name===exName);if(e){const sets=e.sets.filter(s=>s.weight||s.reps);if(sets.length)return{workout:w,exercise:e,sets}}}return null}
function allSetsFor(exName){const out=[];for(const w of getHistory().slice().reverse()){const e=w.exercises?.find(e=>e.name===exName);if(!e)continue;e.sets.forEach(s=>{const weight=parseFloat(s.weight),reps=parseFloat(s.reps);if(Number.isFinite(weight)||Number.isFinite(reps))out.push({date:w.date,weight:Number.isFinite(weight)?weight:0,reps:Number.isFinite(reps)?reps:0})})}return out}
function bestWeight(exName){return Math.max(0,...allSetsFor(exName).map(x=>x.weight))}
function progressionText(ex){const p=previousEntry(ex.name);if(!p)return"First session: establish a clean baseline.";const best=p.sets.slice().sort((a,b)=>(parseFloat(b.weight)||0)-(parseFloat(a.weight)||0))[0];const w=parseFloat(best.weight)||0,r=parseInt(best.reps)||0;if(!w&&r)return`Last: ${r} reps. Aim for ${Math.min(r+1,ex.max||r+1)} clean reps.`;if(r>=(ex.max||999))return`Last: ${w} × ${r}. Increase weight slightly and aim for ${ex.min||r} reps.`;return`Last: ${w||'—'} × ${r||'—'}. Aim for ${w||'same weight'} × ${Math.max(r+1,ex.min||r+1)}.`}
function render(){const day=daySelect.value,exercises=program[day]||[];workout.innerHTML='';$('footerbar').classList.toggle('hidden',exercises.length===0);if(!exercises.length){workout.innerHTML='<div class="rest-card"><h2>Rest Day</h2><p>Recover, walk, eat well, and sleep.</p></div>';renderHistory();renderEditor();populateChartExercises();drawChart();return}const draft=JSON.parse(localStorage.getItem(draftKey(day))||'{}');exercises.forEach(ex=>{const card=document.createElement('div');card.className='exercise';const prev=previousEntry(ex.name);const prevText=prev?prev.sets.map(s=>`${s.weight||'—'} × ${s.reps||'—'}${s.intensity?` (${s.intensity})`:''}`).join(', '):'No previous entry';const sets=draft[ex.name]?.sets||Array.from({length:ex.sets||1},()=>({weight:'',reps:'',intensity:'Failure'}));const notes=draft[ex.name]?.notes||'';card.innerHTML=`<h2>${ex.name}</h2><div class="target">${ex.target}</div><div class="previous"><strong>Previous:</strong> ${prevText}</div><div class="suggestion"><strong>Next target:</strong> ${progressionText(ex)}</div><div class="sets"></div><button class="btn full addSet">+ Add set</button><textarea placeholder="Exercise notes (seat position, setup, pain, etc.)">${notes}</textarea>`;const setsDiv=card.querySelector('.sets');function addSet(s={weight:'',reps:'',intensity:'Failure'}){const row=document.createElement('div');row.className='setrow';row.innerHTML=`<div class="setnum"></div><input inputmode="decimal" placeholder="Weight" value="${s.weight??''}"><input inputmode="numeric" placeholder="Reps" value="${s.reps??''}"><select>${['Failure','0 RIR','1 RIR','2 RIR','Warmup','Rest-pause'].map(v=>`<option ${s.intensity===v?'selected':''}>${v}</option>`).join('')}</select><button class="iconbtn">×</button>`;row.querySelector('.iconbtn').onclick=()=>{row.remove();renumber();saveDraft()};row.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{checkPR(card,ex);saveDraft()}));setsDiv.appendChild(row);renumber();checkPR(card,ex)}function renumber(){[...setsDiv.children].forEach((r,i)=>r.querySelector('.setnum').textContent=i+1)}sets.forEach(addSet);card.querySelector('.addSet').onclick=()=>{addSet();saveDraft()};card.querySelector('textarea').addEventListener('input',saveDraft);workout.appendChild(card)});renderHistory();renderEditor();populateChartExercises();drawChart()}
function checkPR(card,ex){card.querySelectorAll('.pr').forEach(n=>n.remove());const prior=bestWeight(ex.name),rows=[...card.querySelectorAll('.setrow')],maxToday=Math.max(0,...rows.map(r=>parseFloat(r.querySelector('input').value)||0));if(prior>0&&maxToday>prior){const p=document.createElement('div');p.className='pr';p.textContent='🔥 NEW WEIGHT PR';card.querySelector('.suggestion').after(p)}}
function collect(){const day=daySelect.value;return{day,date:new Date().toISOString(),exercises:[...document.querySelectorAll('.exercise')].map(card=>({name:card.querySelector('h2').textContent,notes:card.querySelector('textarea').value.trim(),sets:[...card.querySelectorAll('.setrow')].map(r=>{const ins=r.querySelectorAll('input');return{weight:ins[0].value.trim(),reps:ins[1].value.trim(),intensity:r.querySelector('select').value}})}))}}
function saveDraft(){const data=collect(),obj={};data.exercises.forEach(e=>obj[e.name]={sets:e.sets,notes:e.notes});localStorage.setItem(draftKey(data.day),JSON.stringify(obj))}
$('saveWorkout').onclick=()=>{const data=collect(),h=getHistory();h.unshift(data);setHistory(h.slice(0,300));localStorage.removeItem(draftKey(data.day));render();alert('Workout saved')};$('clearWorkout').onclick=()=>{if(confirm('Clear today’s entries?')){localStorage.removeItem(draftKey(daySelect.value));render()}};
function renderHistory(){const h=getHistory().slice(0,8);historyEl.innerHTML=h.length?'':'<div class="small">No workouts saved yet.</div>';h.forEach(w=>{const div=document.createElement('div');div.className='history-item';const d=new Date(w.date);div.innerHTML=`<strong>${w.day}</strong><div class="small">${d.toLocaleString()}</div>`;historyEl.appendChild(div)})}
function renderEditor(){const ed=$('editor');ed.innerHTML='';const day=daySelect.value,list=program[day]||[];list.forEach((ex,i)=>{const row=document.createElement('div');row.className='editrow';row.innerHTML=`<input aria-label="Exercise name" value="${ex.name}"><input aria-label="Target" value="${ex.target}"><button class="btn moveup" aria-label="Move exercise up" title="Move up" ${i===0?'disabled':''}>↑</button><button class="btn movedown" aria-label="Move exercise down" title="Move down" ${i===list.length-1?'disabled':''}>↓</button><button class="iconbtn remove" aria-label="Remove exercise">×</button>`;const inputs=row.querySelectorAll('input');inputs[0].onchange=()=>{program[day][i].name=inputs[0].value;saveProgram();render()};inputs[1].onchange=()=>{program[day][i].target=inputs[1].value;saveProgram();render()};const move=delta=>{const j=i+delta;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];saveProgram();render()};row.querySelector('.moveup').onclick=()=>move(-1);row.querySelector('.movedown').onclick=()=>move(1);row.querySelector('.remove').onclick=()=>{program[day].splice(i,1);saveProgram();render()};ed.appendChild(row)});const b=document.createElement('button');b.className='btn full';b.textContent='+ Add exercise';b.onclick=()=>{program[day].push({name:'New Exercise',target:'1 working set × 8–10',min:8,max:10});saveProgram();render()};ed.appendChild(b)} function saveProgram(){const selectedDay=daySelect.value;localStorage.setItem('gym-program',JSON.stringify(program));initDays();if(Object.prototype.hasOwnProperty.call(program,selectedDay))daySelect.value=selectedDay}$('resetProgram').onclick=()=>{if(confirm('Reset program to defaults?')){program=clone(DEFAULT_PROGRAM);saveProgram();initDays();daySelect.value=Object.keys(program)[0];render()}};
function populateChartExercises(){const sel=$('chartExercise'),current=sel.value,names=[...new Set(Object.values(program).flat().map(x=>x.name))];sel.innerHTML=names.map(n=>`<option>${n}</option>`).join('');if(names.includes(current))sel.value=current}
function drawChart(){const c=$('chart'),ctx=c.getContext('2d'),name=$('chartExercise').value;ctx.clearRect(0,0,c.width,c.height);const pts=[];for(const w of getHistory().slice().reverse()){const e=w.exercises?.find(e=>e.name===name);if(!e)continue;const max=Math.max(0,...e.sets.map(s=>parseFloat(s.weight)||0));if(max)pts.push({date:new Date(w.date),v:max})}ctx.fillStyle='#0f131a';ctx.fillRect(0,0,c.width,c.height);if(pts.length<1){ctx.fillStyle='#8f9bad';ctx.font='16px sans-serif';ctx.fillText('No data yet',20,35);return}const pad=35,minV=Math.min(...pts.map(p=>p.v)),maxV=Math.max(...pts.map(p=>p.v)),span=Math.max(1,maxV-minV);ctx.strokeStyle='#5ee1a2';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const x=pad+(c.width-2*pad)*(pts.length===1?.5:i/(pts.length-1));const y=c.height-pad-(c.height-2*pad)*((p.v-minV)/span);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#c6ceda';ctx.font='12px sans-serif';ctx.fillText(String(maxV),5,pad);ctx.fillText(String(minV),5,c.height-pad)}$('chartExercise').onchange=drawChart;
function download(name,text,type){const blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('exportJson').onclick=()=>download('gym-log-backup.json',JSON.stringify({program,history:getHistory()},null,2),'application/json');$('exportCsv').onclick=()=>{const rows=[['date','day','exercise','weight','reps','intensity','notes']];getHistory().slice().reverse().forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>rows.push([w.date,w.day,e.name,s.weight||'',s.reps||'',s.intensity||'',e.notes||'']))));const esc=v=>`"${String(v).replaceAll('"','""')}"`;download('gym-log.csv',rows.map(r=>r.map(esc).join(',')).join('\n'),'text/csv')};$('importJson').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.program)program=data.program;if(data.history)setHistory(data.history);saveProgram();initDays();render();alert('Backup imported')}catch(e){alert('Could not import that JSON file')}};
daySelect.onchange=render;initDays();daySelect.value=Object.keys(program)[0];render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script src="patch.js"></script>
</body>
</html>
